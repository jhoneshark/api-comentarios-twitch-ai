services:
  api:
    build: .
    restart: unless-stopped
    environment:
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_OAUTH_TOKEN: ${TWITCH_OAUTH_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: ${PORT:-8080}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
